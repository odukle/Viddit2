# Codemagic Configuration for Scroller (RedVid)
# Reference: https://docs.codemagic.io/yaml-quick-start/

workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 45
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Cineverse iOS"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.odukle.scroller
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find ios -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - sodukle@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
